name: coffee-morning
on:
  schedule:
    # días hábiles antes de la campana (UTC): 5:10, 6:10, 6:40, 7:10 y 8:10 hora CDMX
    - cron: '10 11,12,13,14 * * 1-5'
    - cron: '40 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy
      - name: Overnight, liquidez, noticias y Mirador
        run: python3 tools/cafe.py
      - name: Publicar
        run: |
          git config user.name "northpoint-bot"
          git config user.email "bot@northpoint"
          git add data/cafe.json
          git diff --cached --quiet || (git commit -m "data: coffee morning $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase -q && git push)
